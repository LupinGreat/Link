<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Drop</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#1d2433; --muted:#6b7488;
    --accent:#4f46e5; --accent2:#7c3aed; --ok:#16a34a; --bad:#dc2626; --border:#e3e7f0;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1220; --card:#1a1e33; --text:#eef0f8; --muted:#98a0b8; --border:#2b3150; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; padding:16px; display:flex; justify-content:center;
  }
  .app{width:100%; max-width:520px}
  header{text-align:center; margin:8px 0 18px}
  header h1{
    margin:0; font-size:28px; letter-spacing:-.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{margin:6px 0 0; color:var(--muted); font-size:14px}
  .card{
    background:var(--card); border:1px solid var(--border);
    border-radius:18px; padding:20px; box-shadow:0 6px 24px rgba(20,25,60,.07);
  }
  .hidden{display:none !important}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row > *{flex:1 1 140px}
  button{
    font:inherit; font-weight:600; border:0; border-radius:12px; padding:13px 16px;
    cursor:pointer; transition:transform .06s, opacity .15s;
  }
  button:active{transform:scale(.97)}
  button:disabled{opacity:.5; cursor:not-allowed}
  .primary{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#fff}
  .ghost{background:transparent; color:var(--text); border:1px solid var(--border)}
  .small{padding:8px 12px; font-size:13px; border-radius:10px}
  input[type=text]{
    width:100%; font:inherit; font-size:22px; letter-spacing:6px; text-align:center;
    text-transform:uppercase; padding:14px; border-radius:12px;
    border:1px solid var(--border); background:var(--bg); color:var(--text);
  }
  textarea{
    width:100%; min-height:110px; resize:vertical; font:inherit; font-size:16px;
    padding:12px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg); color:var(--text);
  }
  input:focus,textarea:focus{outline:2px solid var(--accent); border-color:transparent}
  .or{text-align:center; color:var(--muted); margin:14px 0; font-size:13px}
  .code{
    font-size:38px; font-weight:800; letter-spacing:10px; text-align:center;
    padding:14px 0 14px 10px; border-radius:14px; background:var(--bg);
    border:1px dashed var(--accent); color:var(--accent); user-select:all;
  }
  .hint{color:var(--muted); font-size:13px; text-align:center; margin:10px 0 0}
  .status{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:14px; font-size:14px;
  }
  .dot{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--muted); margin-right:8px}
  .dot.ok{background:var(--ok); box-shadow:0 0 0 4px rgba(22,163,74,.18)}
  .dot.wait{background:#f59e0b; animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .err{color:var(--bad); font-size:13px; text-align:center; margin-top:10px; min-height:16px}
  .sent{color:var(--ok); font-size:13px; text-align:center; margin-top:8px; min-height:16px}

  /* incoming popups */
  #inbox{
    position:fixed; left:0; right:0; bottom:0; z-index:50; padding:12px;
    display:flex; flex-direction:column; gap:10px; align-items:center; pointer-events:none;
  }
  .msg{
    pointer-events:auto; width:100%; max-width:520px;
    background:var(--card); border:1px solid var(--accent); border-radius:16px;
    padding:16px; box-shadow:0 12px 40px rgba(20,25,60,.3);
    animation:slide .25s ease-out;
  }
  @keyframes slide{from{transform:translateY(30px); opacity:0}}
  .msg .label{font-size:12px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:1px}
  .msg .body{margin:8px 0 12px; word-break:break-word; white-space:pre-wrap; max-height:180px; overflow:auto}
  .msg .body a{color:var(--accent)}
  .msg .actions{display:flex; gap:8px; flex-wrap:wrap}
  .msg .actions a{text-decoration:none; display:inline-block}
  .linkbtn{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#fff; font-weight:600; border-radius:10px; padding:8px 14px; font-size:13px}
  footer{text-align:center; color:var(--muted); font-size:12px; margin:16px 0 90px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>⚡ Link Drop</h1>
    <p>Send a link or text between your devices. Nothing is saved.</p>
  </header>

  <!-- STEP 1: pair -->
  <section id="pair" class="card">
    <button id="btnCreate" class="primary" style="width:100%">Start on this device</button>
    <div class="or">— then on your other device —</div>
    <input id="joinCode" type="text" maxlength="6" placeholder="CODE" autocomplete="off" autocapitalize="characters">
    <button id="btnJoin" class="ghost" style="width:100%; margin-top:10px">Connect with code</button>
    <div id="pairErr" class="err"></div>
  </section>

  <!-- waiting for other device -->
  <section id="waiting" class="card hidden">
    <div class="status"><span><span class="dot wait"></span>Waiting for your other device…</span></div>
    <div id="codeShow" class="code">------</div>
    <p class="hint">Open this page on your other device, type this code, tap Connect.</p>
    <button id="btnCancel" class="ghost small" style="margin-top:14px">Cancel</button>
  </section>

  <!-- connected -->
  <section id="chat" class="card hidden">
    <div class="status">
      <span><span class="dot ok"></span><span id="statusText">Connected</span></span>
      <button id="btnLeave" class="ghost small">Disconnect</button>
    </div>
    <textarea id="text" placeholder="Paste a link or type something to send…"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="btnPaste" class="ghost">📋 Paste</button>
      <button id="btnSend" class="primary">Send ➤</button>
    </div>
    <div id="sentMsg" class="sent"></div>
  </section>

  <footer>Devices connect directly to each other. Close this page and everything is gone.</footer>
</div>

<div id="inbox"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var PREFIX = "linkdrop-x7-";
  var peer = null, conns = [], isHost = false;

  function show(which){
    ["pair","waiting","chat"].forEach(function(s){ $(s).classList.toggle("hidden", s !== which); });
  }
  function makeCode(){
    var c = ""; for (var i=0;i<6;i++) c += ALPHABET[Math.floor(Math.random()*ALPHABET.length)];
    return c;
  }
  function reset(){
    conns.forEach(function(c){ try{c.close();}catch(e){} });
    conns = [];
    if (peer){ try{peer.destroy();}catch(e){} peer = null; }
    isHost = false;
    $("pairErr").textContent = "";
    show("pair");
  }
  function updateStatus(){
    var n = conns.filter(function(c){ return c.open; }).length;
    $("statusText").textContent = n > 1 ? "Connected (" + n + " devices)" : "Connected";
  }

  /* ---------- host ---------- */
  function startHost(){
    if (typeof Peer === "undefined"){ $("pairErr").textContent = "Could not load connection library. Check your internet."; return; }
    var code = makeCode();
    isHost = true;
    peer = new Peer(PREFIX + code);
    peer.on("open", function(){
      $("codeShow").textContent = code;
      show("waiting");
    });
    peer.on("connection", function(conn){ attach(conn); });
    peer.on("error", function(err){
      if (err.type === "unavailable-id"){ try{peer.destroy();}catch(e){} startHost(); return; }
      $("pairErr").textContent = "Connection problem: " + err.type;
      if ($("waiting").classList.contains("hidden") === false) reset();
    });
  }

  /* ---------- joiner ---------- */
  function startJoin(){
    var code = $("joinCode").value.trim().toUpperCase();
    if (code.length !== 6){ $("pairErr").textContent = "Enter the 6-character code."; return; }
    if (typeof Peer === "undefined"){ $("pairErr").textContent = "Could not load connection library. Check your internet."; return; }
    $("pairErr").textContent = "Connecting…";
    peer = new Peer();
    var timer = setTimeout(function(){
      $("pairErr").textContent = "Could not connect. Check the code and try again.";
      try{peer.destroy();}catch(e){} peer = null;
    }, 12000);
    peer.on("open", function(){
      var conn = peer.connect(PREFIX + code, {reliable:true});
      conn.on("open", function(){ clearTimeout(timer); attach(conn); });
    });
    peer.on("error", function(err){
      clearTimeout(timer);
      $("pairErr").textContent = err.type === "peer-unavailable"
        ? "No device found with that code." : "Connection problem: " + err.type;
      try{peer.destroy();}catch(e){} peer = null;
    });
  }

  /* ---------- shared ---------- */
  function attach(conn){
    function ready(){
      if (conns.indexOf(conn) === -1) conns.push(conn);
      show("chat"); updateStatus(); $("pairErr").textContent = "";
    }
    if (conn.open) ready(); else conn.on("open", ready);
    conn.on("data", function(data){
      if (!data || typeof data.t !== "string") return;
      popup(data.t);
      // host relays to any other connected devices
      if (isHost) conns.forEach(function(c){ if (c !== conn && c.open) c.send(data); });
    });
    conn.on("close", function(){
      conns = conns.filter(function(c){ return c !== conn; });
      if (conns.length === 0){
        if (isHost){ show("waiting"); }
        else { $("pairErr").textContent = "Other device disconnected."; reset(); $("pairErr").textContent = "Other device disconnected."; }
      } else updateStatus();
    });
  }

  function send(){
    var t = $("text").value.trim();
    if (!t) return;
    var open = conns.filter(function(c){ return c.open; });
    if (!open.length){ $("sentMsg").textContent = ""; return; }
    open.forEach(function(c){ c.send({t:t}); });
    $("text").value = "";
    $("sentMsg").textContent = "Sent ✓";
    setTimeout(function(){ $("sentMsg").textContent = ""; }, 2000);
  }

  function isUrl(s){ return /^https?:\/\/\S+$/i.test(s.trim()); }
  function copyText(s, btn){
    function done(){ var o = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(function(){ btn.textContent = o; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(s).then(done, fallback);
    } else fallback();
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){}
      document.body.removeChild(ta);
    }
  }

  function popup(text){
    var card = document.createElement("div"); card.className = "msg";
    var label = document.createElement("div"); label.className = "label"; label.textContent = "Received";
    var body = document.createElement("div"); body.className = "body"; body.textContent = text;
    var actions = document.createElement("div"); actions.className = "actions";

    if (isUrl(text)){
      var a = document.createElement("a");
      a.href = text.trim(); a.target = "_blank"; a.rel = "noopener noreferrer";
      a.className = "linkbtn"; a.textContent = "Open link ↗";
      actions.appendChild(a);
    }
    var copy = document.createElement("button"); copy.className = "ghost small"; copy.textContent = "Copy";
    copy.onclick = function(){ copyText(text, copy); };
    var close = document.createElement("button"); close.className = "ghost small"; close.textContent = "Dismiss";
    close.onclick = function(){ card.remove(); };
    actions.appendChild(copy); actions.appendChild(close);

    card.appendChild(label); card.appendChild(body); card.appendChild(actions);
    $("inbox").appendChild(card);
    try{ if (navigator.vibrate) navigator.vibrate(120); }catch(e){}
  }

  /* ---------- wire up ---------- */
  $("btnCreate").onclick = startHost;
  $("btnJoin").onclick = startJoin;
  $("joinCode").addEventListener("keydown", function(e){ if (e.key === "Enter") startJoin(); });
  $("btnCancel").onclick = reset;
  $("btnLeave").onclick = reset;
  $("btnSend").onclick = send;
  $("text").addEventListener("keydown", function(e){
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send();
  });
  $("btnPaste").onclick = function(){
    if (navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(t){ $("text").value = t; $("text").focus(); },
        function(){ $("sentMsg").textContent = "Paste blocked here, long-press the box and paste."; });
    } else $("sentMsg").textContent = "Long-press the box and paste.";
  };
})();
</script>
</body>
</html>
